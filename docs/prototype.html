<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Chambre Lofi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Gluten:wght@600;800&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
/* Layout: full-bleed isometric diorama floating on a soft sky · name top-left · floating mixer dock at the bottom */
:root{
  --bg:#e5daef;
  --day-1:#f7f1fa; --day-2:#e7dcf0; --day-3:#d2c1e3;
  --night-1:#342d66; --night-2:#211c44; --night-3:#13102a;
  --ink:#33264a; --ink-soft:#6b5b85;
  --panel:rgba(255,251,255,.76); --line:rgba(80,60,120,.15);
  --accent:#128d96; --accent-soft:rgba(18,141,150,.12);
  --icon-ink:#33264a;
  --c-radio:#9fdecd; --c-rain:#b9d4f7; --c-fan:#f8dc8c; --c-cat:#dcd2f2; --c-win:#f7c4d4;
  --shadow:0 12px 32px rgba(72,50,112,.16);
  --font-display:"Gluten","Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --font-body:"Nunito",ui-rounded,"Segoe UI",system-ui,sans-serif;
  --font-mono:"DM Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
html.night{
  --bg:#191632; --ink:#f3eeff; --ink-soft:#b8addb;
  --panel:rgba(30,25,58,.78); --line:rgba(210,190,255,.15);
  --accent:#6cd9d2; --accent-soft:rgba(108,217,210,.14);
  --shadow:0 12px 32px rgba(0,0,0,.38);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--ink);font:500 14px/1.4 var(--font-body);-webkit-font-smoothing:antialiased;transition:background-color .8s,color .6s}

.sky{position:fixed;inset:0;pointer-events:none}
.sky-day{background:radial-gradient(130% 90% at 50% 40%,var(--day-1) 0%,var(--day-2) 52%,var(--day-3) 100%)}
.sky-night{opacity:0;transition:opacity 1.2s ease;
  background:
    radial-gradient(1.4px 1.4px at 14% 22%,rgba(255,250,235,.85),transparent 60%),
    radial-gradient(1.2px 1.2px at 31% 9%,rgba(255,250,235,.7),transparent 60%),
    radial-gradient(1.6px 1.6px at 72% 16%,rgba(255,250,235,.85),transparent 60%),
    radial-gradient(1.1px 1.1px at 86% 34%,rgba(255,250,235,.6),transparent 60%),
    radial-gradient(1.3px 1.3px at 8% 58%,rgba(255,250,235,.55),transparent 60%),
    radial-gradient(1.2px 1.2px at 93% 64%,rgba(255,250,235,.55),transparent 60%),
    radial-gradient(1.4px 1.4px at 55% 6%,rgba(255,250,235,.7),transparent 60%),
    radial-gradient(130% 90% at 50% 40%,var(--night-1) 0%,var(--night-2) 52%,var(--night-3) 100%)}
html.night .sky-night{opacity:1}

#scene{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none;cursor:grab}

.top{position:fixed;top:0;left:0;right:0;z-index:4;display:flex;align-items:flex-start;justify-content:space-between;gap:12px;
  padding:calc(14px + env(safe-area-inset-top,0px)) 16px 0;pointer-events:none}
.brand{min-width:0}
.brand h1{margin:0;font:800 clamp(26px,5.2vw,36px)/1 var(--font-display);letter-spacing:.01em;color:var(--ink);text-wrap:balance}
.brand p{margin:7px 0 0;font-size:13px;line-height:1.35;color:var(--ink-soft);max-width:31ch}
.tools{display:flex;gap:8px;pointer-events:auto;flex:none}
.clock,.mode{height:42px;border-radius:15px;border:1px solid var(--line);background:var(--panel);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:var(--shadow);color:var(--ink)}
.clock{display:flex;align-items:center;padding:0 12px;font:500 13px/1 var(--font-mono);font-variant-numeric:tabular-nums}
.mode{width:42px;display:grid;place-items:center;cursor:pointer;padding:0}
.mode svg{width:20px;height:20px}
.mode:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

#hotspots{position:fixed;inset:0;pointer-events:none;z-index:3}
.hs{position:absolute;left:0;top:0;width:40px;height:40px;margin:-20px 0 0 -20px;border:0;padding:0;background:none;
  cursor:pointer;border-radius:50%;pointer-events:auto;-webkit-tap-highlight-color:transparent;will-change:transform}
.hs::before{content:"";position:absolute;inset:13px;border-radius:50%;background:#fff;
  box-shadow:0 0 0 3px rgba(255,255,255,.42),0 2px 8px rgba(50,30,90,.35);transition:transform .3s cubic-bezier(.3,1.6,.5,1),background .3s}
.hs::after{content:"";position:absolute;inset:11px;border-radius:50%;border:2px solid rgba(255,255,255,.85);
  animation:ping 2.6s ease-out infinite;animation-delay:var(--d,0s)}
@keyframes ping{0%{transform:scale(.6);opacity:.9}75%,100%{transform:scale(2);opacity:0}}
.hs.on::before{background:var(--accent);transform:scale(.55)}
.hs.on::after,body.seasoned .hs::after{animation:none;opacity:0}
.hs .lbl{position:absolute;left:50%;bottom:calc(100% - 4px);transform:translateX(-50%);white-space:nowrap;
  font:800 12px/1 var(--font-body);color:var(--ink);background:var(--panel);border:1px solid var(--line);
  padding:6px 10px;border-radius:999px;opacity:0;transition:opacity .2s;pointer-events:none;box-shadow:var(--shadow)}
@media (hover:hover){.hs:hover .lbl{opacity:1}}
.hs:focus-visible .lbl{opacity:1}
.hs:focus-visible{outline:2px solid var(--accent);outline-offset:-4px}

.dock{position:fixed;left:0;right:0;bottom:0;z-index:4;display:flex;justify-content:center;
  padding:0 12px calc(12px + env(safe-area-inset-bottom,0px));pointer-events:none}
.dock-inner{pointer-events:auto;width:100%;max-width:880px;min-width:0;background:var(--panel);
  -webkit-backdrop-filter:blur(16px) saturate(1.2);backdrop-filter:blur(16px) saturate(1.2);
  border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);padding:8px 8px 10px}
.dock-head{display:flex;align-items:center;gap:10px;padding:2px 6px 8px 8px;min-height:22px}
.eyebrow{font:800 11px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft)}
.count{font:500 11.5px/1 var(--font-mono);color:var(--ink-soft);font-variant-numeric:tabular-nums}
.mute{margin-left:auto;font:800 12px/1 var(--font-body);color:var(--accent);background:none;border:0;padding:5px 8px;border-radius:10px;cursor:pointer}
.mute:focus-visible{outline:2px solid var(--accent)}
.mix{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x proximity;scrollbar-width:none;padding:1px}
.mix::-webkit-scrollbar{display:none}
.card{flex:1 0 156px;min-width:0;scroll-snap-align:start;display:grid;gap:8px;padding:9px 10px 7px;border-radius:18px;
  border:1px solid var(--line);transition:background-color .3s,border-color .3s}
.card.on{background:var(--accent-soft);border-color:var(--accent)}
.tg{display:flex;align-items:center;gap:10px;min-width:0;background:none;border:0;padding:0;color:inherit;font:inherit;text-align:left;cursor:pointer;border-radius:12px}
.tg:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.ico{position:relative;flex:none;width:34px;height:34px;border-radius:12px;display:grid;place-items:center;background:var(--chip);color:var(--icon-ink);
  transition:transform .35s cubic-bezier(.3,1.7,.5,1)}
.ico svg{width:20px;height:20px}
.card.on .ico{transform:scale(1.06) rotate(-5deg)}
.eq{position:absolute;right:-6px;bottom:-6px;display:flex;align-items:flex-end;gap:2px;height:16px;padding:3px 4px;border-radius:8px;
  background:var(--accent);opacity:0;transform:scale(.6);transition:opacity .25s,transform .3s}
.eq i{display:block;width:2.5px;height:3px;border-radius:2px;background:#fff}
.card.on .eq{opacity:1;transform:none}
.card.on .eq i{animation:eq .7s ease-in-out infinite alternate}
.card.on .eq i:nth-child(2){animation-delay:-.25s}.card.on .eq i:nth-child(3){animation-delay:-.5s}
@keyframes eq{from{height:2px}to{height:10px}}
.txt{display:grid;gap:3px;min-width:0}
.nm{font:800 14px/1.1 var(--font-body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb{font:500 11px/1.2 var(--font-mono);color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.card input[type=range]{width:100%;margin:0;height:18px;accent-color:var(--accent);opacity:.5;transition:opacity .3s;cursor:pointer}
.card.on input[type=range]{opacity:1}

@media (max-width:520px){
  .brand p{font-size:12.5px;max-width:24ch}
  .clock{display:none}
}
@media (prefers-reduced-motion:reduce){
  .hs::after,.card.on .eq i{animation:none}
  *{transition-duration:.01s!important}
}
</style>
</head>
<body>
<div class="sky sky-day" aria-hidden="true"></div>
<div class="sky sky-night" aria-hidden="true"></div>
<canvas id="scene" role="img" aria-label="Chambre lofi en 3D isométrique : lit avec un chat, bureau avec radio et ventilateur, fenêtre, nuage, lampe champignon."></canvas>

<header class="top" id="top">
  <div class="brand">
    <h1>Chambre Lofi</h1>
    <p>Touche les objets pour composer ton ambiance. Glisse pour tourner la pièce.</p>
  </div>
  <div class="tools">
    <span class="clock" id="clock" aria-label="Heure locale">--:--</span>
    <button class="mode" id="mode" type="button"></button>
  </div>
</header>

<div id="hotspots"></div>

<nav class="dock" id="dock" aria-label="Mixeur d'ambiance">
  <div class="dock-inner">
    <div class="dock-head">
      <span class="eyebrow">Ambiance</span>
      <span class="count" id="count">silence</span>
      <button class="mute" id="mute" type="button" hidden>Tout couper</button>
    </div>
    <div class="mix" id="mix"></div>
  </div>
</nav>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
'use strict';
const TAU = Math.PI * 2;
const $ = (s) => document.querySelector(s);
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (x) => x * x * (3 - 2 * x);
const approach = (v, t, s) => (v < t ? Math.min(t, v + s) : Math.max(t, v - s));
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const noRay = () => {};

/* ------------------------------------------------------------------ state */
const hour = new Date().getHours();
const state = {
  night: hour >= 20 || hour < 7,
  on: { radio: false, rain: false, fan: false, cat: false, window: false },
  vol: { radio: 0.75, rain: 0.7, fan: 0.55, cat: 0.7, window: 0.65 },
};
const rootEl = document.documentElement;
rootEl.classList.toggle('night', state.night);

/* ------------------------------------------------------------------ renderer */
const canvas = $('#scene');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setClearColor(0x000000, 0);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
const camera = new THREE.OrthographicCamera(-5, 5, 5, -5, 0.1, 120);
const CAM_DIR = new THREE.Vector3(1, 0.8, 1).normalize();
const LOOK = new THREE.Vector3(0, 1.85, 0);
camera.position.copy(LOOK).addScaledVector(CAM_DIR, 40);
camera.lookAt(LOOK);

const hemi = new THREE.HemisphereLight(0xfff4fb, 0xbca8d0, 0.62);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff0e2, 0.6);
sun.position.set(5, 10, 7);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -8, right: 8, top: 8, bottom: -8, near: 1, far: 30 });
sun.shadow.camera.updateProjectionMatrix();
sun.shadow.bias = -0.0004;
sun.shadow.normalBias = 0.03;
scene.add(sun, sun.target);

const room = new THREE.Group();
scene.add(room);
const fx = new THREE.Group();
room.add(fx);

/* ------------------------------------------------------------------ helpers */
function rbox(w, h, d, r = 0.06, seg = 3) {
  const s = seg * 2 + 1;
  const g = new THREE.BoxGeometry(1, 1, 1, s, s, s);
  r = Math.min(r, Math.min(w, h, d) / 2 - 1e-4);
  const half = 0.5 / s, bx = w / 2 - r, by = h / 2 - r, bz = d / 2 - r;
  const pos = g.attributes.position, nor = g.attributes.normal, n = new THREE.Vector3();
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i), y = pos.getY(i), z = pos.getZ(i);
    const sx = Math.sign(x), sy = Math.sign(y), sz = Math.sign(z);
    n.set(x - sx * half, y - sy * half, z - sz * half).normalize();
    pos.setXYZ(i, sx * bx + n.x * r, sy * by + n.y * r, sz * bz + n.z * r);
    nor.setXYZ(i, n.x, n.y, n.z);
  }
  return g;
}
function rrPath(p, x, y, w, h, r) {
  p.moveTo(x + r, y);
  p.lineTo(x + w - r, y); p.quadraticCurveTo(x + w, y, x + w, y + r);
  p.lineTo(x + w, y + h - r); p.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  p.lineTo(x + r, y + h); p.quadraticCurveTo(x, y + h, x, y + h - r);
  p.lineTo(x, y + r); p.quadraticCurveTo(x, y, x + r, y);
  return p;
}
function gummy(hex, o) {
  return new THREE.MeshPhysicalMaterial(Object.assign({ color: hex, roughness: 0.46, metalness: 0, clearcoat: 0.55, clearcoatRoughness: 0.3 }, o || {}));
}
function mesh(geo, mat, cast = true, receive = true) {
  const m = new THREE.Mesh(geo, mat);
  m.castShadow = cast; m.receiveShadow = receive;
  return m;
}
function put(parent, obj, x = 0, y = 0, z = 0) { obj.position.set(x, y, z); parent.add(obj); return obj; }
const SPH = new THREE.SphereGeometry(1, 32, 22);
function ell(rx, ry, rz, mat) { const m = mesh(SPH, mat); m.scale.set(rx, ry, rz); return m; }
function cyl(rt, rb, h, mat, seg = 24) { return mesh(new THREE.CylinderGeometry(rt, rb, h, seg), mat); }
function makeCanvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return [c, c.getContext('2d')]; }
function rr2d(x, X, Y, W, H, R) {
  x.beginPath(); x.moveTo(X + R, Y);
  x.arcTo(X + W, Y, X + W, Y + H, R); x.arcTo(X + W, Y + H, X, Y + H, R);
  x.arcTo(X, Y + H, X, Y, R); x.arcTo(X, Y, X + W, Y, R); x.closePath();
}

/* ------------------------------------------------------------------ textures */
function woodTexture() {
  const [c, x] = makeCanvas(512, 512);
  const tones = ['#ebb68d', '#e4aa82', '#efc09a', '#e7b088', '#f0c5a1'];
  const rows = 11, h = 512 / rows;
  for (let r = 0; r < rows; r++) {
    let px = -Math.random() * 220;
    while (px < 512) {
      const w = 150 + Math.random() * 130;
      x.fillStyle = tones[(Math.random() * tones.length) | 0];
      x.fillRect(px, r * h, w, h);
      x.fillStyle = 'rgba(130,70,50,.16)';
      x.fillRect(px, r * h, 2, h);
      for (let k = 0; k < 3; k++) {
        x.fillStyle = 'rgba(255,240,225,.10)';
        x.fillRect(px + 8, r * h + 6 + Math.random() * (h - 12), w - 16, 1.5);
      }
      px += w;
    }
    x.fillStyle = 'rgba(130,70,50,.14)';
    x.fillRect(0, r * h, 512, 2);
  }
  const t = new THREE.CanvasTexture(c);
  t.anisotropy = 4;
  return t;
}
function muralTexture() {
  const [c, x] = makeCanvas(1024, 680);
  x.fillStyle = '#f4e9e2'; x.fillRect(0, 0, 1024, 680);
  x.fillStyle = '#cfe8e4'; rr2d(x, 70, 120, 118, 620, 59); x.fill();
  x.fillStyle = '#f7ccd7'; rr2d(x, 206, 220, 84, 520, 42); x.fill();
  const cx = 610, cy = 505;
  [[300, '#3aa6b6'], [246, '#f3a6bd'], [192, '#f6cf6a'], [138, '#f4e9e2']].forEach(([r, col]) => {
    x.fillStyle = col; x.beginPath(); x.arc(cx, cy, r, Math.PI, 0); x.closePath(); x.fill();
  });
  x.fillStyle = '#4b3a5a'; x.beginPath(); x.arc(890, 175, 46, 0, TAU); x.fill();
  x.fillStyle = 'rgba(75,58,90,.35)';
  for (let i = 0; i < 5; i++) { x.beginPath(); x.arc(380 + i * 22, 100, 4, 0, TAU); x.fill(); }
  return new THREE.CanvasTexture(c);
}
function posterTexture() {
  const [c, x] = makeCanvas(256, 320);
  x.fillStyle = '#fff6ee'; x.fillRect(0, 0, 256, 320);
  x.save(); rr2d(x, 22, 22, 212, 276, 18); x.clip();
  const g = x.createLinearGradient(0, 22, 0, 298);
  g.addColorStop(0, '#f5a9c2'); g.addColorStop(1, '#f9dc95');
  x.fillStyle = g; x.fillRect(0, 0, 256, 320);
  x.fillStyle = '#fff3d4'; x.beginPath(); x.arc(128, 168, 44, 0, TAU); x.fill();
  [['#86d1d0', 206, 12], ['#43a9b7', 232, 11], ['#2f8b9a', 258, 9]].forEach(([col, y, a]) => {
    x.fillStyle = col; x.beginPath(); x.moveTo(0, y);
    for (let px = 0; px <= 256; px += 8) x.lineTo(px, y + Math.sin(px / 26) * a);
    x.lineTo(256, 320); x.lineTo(0, 320); x.closePath(); x.fill();
  });
  x.restore();
  return new THREE.CanvasTexture(c);
}
function spriteTex(size, draw) { const [c, x] = makeCanvas(size, size); draw(x, size); return new THREE.CanvasTexture(c); }
function drawNote(col) {
  return (x) => {
    x.lineCap = 'round'; x.lineJoin = 'round';
    for (const pass of [0, 1]) {
      x.strokeStyle = pass ? col : '#ffffff'; x.fillStyle = pass ? col : '#ffffff';
      x.lineWidth = pass ? 5 : 11;
      x.beginPath(); x.ellipse(24, 46, pass ? 10 : 13, pass ? 7.5 : 10.5, -0.4, 0, TAU); x.fill();
      x.beginPath(); x.moveTo(33, 44); x.lineTo(33, 12); x.quadraticCurveTo(44, 17, 50, 29); x.stroke();
    }
  };
}
const noteTexA = spriteTex(64, drawNote('#178f99'));
const noteTexB = spriteTex(64, drawNote('#e46f9b'));
const heartTex = spriteTex(64, (x) => {
  const heart = () => { x.beginPath(); x.moveTo(32, 52); x.bezierCurveTo(10, 38, 8, 20, 22, 16); x.bezierCurveTo(28, 14, 32, 19, 32, 24); x.bezierCurveTo(32, 19, 36, 14, 42, 16); x.bezierCurveTo(56, 20, 54, 38, 32, 52); x.closePath(); };
  x.lineWidth = 7; x.strokeStyle = '#fff'; heart(); x.stroke();
  x.fillStyle = '#f2779f'; heart(); x.fill();
});
const puffTex = spriteTex(64, (x) => {
  const g = x.createRadialGradient(32, 32, 0, 32, 32, 30);
  g.addColorStop(0, 'rgba(255,255,255,.95)'); g.addColorStop(1, 'rgba(255,255,255,0)');
  x.fillStyle = g; x.fillRect(0, 0, 64, 64);
});
const glowTex = spriteTex(128, (x) => {
  const g = x.createRadialGradient(64, 64, 0, 64, 64, 62);
  g.addColorStop(0, 'rgba(255,205,140,.9)'); g.addColorStop(0.35, 'rgba(255,180,110,.35)'); g.addColorStop(1, 'rgba(255,170,100,0)');
  x.fillStyle = g; x.fillRect(0, 0, 128, 128);
});
const shadowTex = spriteTex(256, (x) => {
  const g = x.createRadialGradient(128, 128, 0, 128, 128, 126);
  g.addColorStop(0, 'rgba(70,45,110,.5)'); g.addColorStop(0.55, 'rgba(70,45,110,.22)'); g.addColorStop(1, 'rgba(70,45,110,0)');
  x.fillStyle = g; x.fillRect(0, 0, 256, 256);
});

/* ------------------------------------------------------------------ palette */
const M = {
  wallBack: gummy(0xeae1f1, { roughness: 0.78, clearcoat: 0.12 }),
  wallLeft: gummy(0xf3e8e1, { roughness: 0.78, clearcoat: 0.12 }),
  base: gummy(0xc5b3dc, { roughness: 0.6 }),
  floor: gummy(0xffffff, { map: woodTexture(), roughness: 0.5, clearcoat: 0.45 }),
  toffee: gummy(0xc77f5e),
  toffeeLight: gummy(0xe2b08b),
  cream: gummy(0xfff7ef, { roughness: 0.62, clearcoat: 0.25 }),
  pillow: gummy(0xfffaf4, { roughness: 0.66, clearcoat: 0.2 }),
  teal: gummy(0x37a3b5),
  tealLight: gummy(0x9edbe0),
  pink: gummy(0xf3afc6),
  mint: gummy(0x8fd8c6),
  mintDark: gummy(0x58b3a3),
  butter: gummy(0xf6d071),
  plum: gummy(0x4a3a5a, { roughness: 0.38 }),
  peri: gummy(0xabb6ef, { roughness: 0.7, clearcoat: 0.2 }),
  woodLight: gummy(0xecc9a0),
  woodLeg: gummy(0xd8ad85),
  terracotta: gummy(0xee9d86),
  leaf: gummy(0x67bb7c),
  leaf2: gummy(0x8ed59b),
  fur: gummy(0xb7b4ca, { roughness: 0.62, clearcoat: 0.2 }),

/* ------------------------------------------------------------------ sky drawing */
const hex = (h) => { const n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; };
const mixC = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
const css = (c, a = 1) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;
const SK = {
  dTop: hex('#bfe4f4'), dBot: hex('#f8dbe8'), nTop: hex('#1c2252'), nBot: hex('#3d3577'),
  rdTop: hex('#aab3c6'), rdBot: hex('#d6d4e0'), rnTop: hex('#202238'), rnBot: hex('#34324f'),
  h1D: hex('#d9c6e8'), h1N: hex('#2d2955'), h2D: hex('#c4aedb'), h2N: hex('#221e45'),
};
const skyStars = Array.from({ length: 55 }, () => [rand(50, 470), rand(70, 270), rand(0.6, 1.8), Math.random()]);
function drawSky(n, r) {
  const top = mixC(mixC(SK.dTop, SK.nTop, n), mixC(SK.rdTop, SK.rnTop, n), r);
  const bot = mixC(mixC(SK.dBot, SK.nBot, n), mixC(SK.rdBot, SK.rnBot, n), r);
  const g = skx.createLinearGradient(0, 60, 0, 360);
  g.addColorStop(0, css(top)); g.addColorStop(1, css(bot));
  skx.fillStyle = g; skx.fillRect(0, 0, 512, 400);
  const sa = n * (1 - r * 0.9);
  if (sa > 0.01) {
    for (const s of skyStars) { skx.fillStyle = `rgba(255,248,230,${(sa * (0.35 + 0.65 * s[3])).toFixed(3)})`; skx.beginPath(); skx.arc(s[0], s[1], s[2], 0, TAU); skx.fill(); }
    const mg = skx.createRadialGradient(330, 150, 10, 330, 150, 80);
    mg.addColorStop(0, `rgba(255,240,210,${0.35 * sa})`); mg.addColorStop(1, 'rgba(255,240,210,0)');
    skx.fillStyle = mg; skx.fillRect(220, 40, 220, 220);
    skx.fillStyle = `rgba(255,245,218,${sa})`; skx.beginPath(); skx.arc(330, 150, 25, 0, TAU); skx.fill();
  }
  const su = (1 - n) * (1 - r * 0.85);
  if (su > 0.01) {
    const sg = skx.createRadialGradient(140, 170, 10, 140, 170, 90);
    sg.addColorStop(0, `rgba(255,244,205,${0.7 * su})`); sg.addColorStop(1, 'rgba(255,244,205,0)');
    skx.fillStyle = sg; skx.fillRect(40, 70, 200, 200);
    skx.fillStyle = `rgba(255,247,220,${su})`; skx.beginPath(); skx.arc(140, 170, 26, 0, TAU); skx.fill();
  }
  skx.fillStyle = css(mixC(SK.h1D, SK.h1N, n));
  skx.beginPath(); skx.ellipse(130, 372, 230, 72, 0, 0, TAU); skx.ellipse(450, 380, 220, 84, 0, 0, TAU); skx.fill();
  skx.fillStyle = css(mixC(SK.h2D, SK.h2N, n));
  skx.beginPath(); skx.ellipse(300, 400, 260, 58, 0, 0, TAU); skx.fill();
  skyTex.needsUpdate = true;
}

const mtof = (m) => 440 * Math.pow(2, (m - 69) / 12);
const A = {
  ctx: null, master: null, bus: {}, built: {}, buf: null, rainLP: null,
  base: { radio: 0.9, rain: 1.0, fan: 0.75, cat: 0.95, window: 1.0 },
  ensure() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return true; }
    const AC = window.AudioContext || window.webkitAudioContext;

    loopSrc(A.buf.pink, 3.3).connect(biq('lowpass', 650, 0.4)).connect(gainN(0.16)).connect(out);
    W.in = gainN(1);
    const hp = biq('highpass', 1100, 0.5), conv = ctx.createConvolver();
    conv.buffer = impulse(2.2, 3.2);
    W.in.connect(hp); hp.connect(gainN(0.75)).connect(out); hp.connect(conv); conv.connect(gainN(0.4)).connect(out);
  },
};
const HOOK = {
  radio: (on) => (on ? R.start() : R.stopSoon()),
  window: (on) => { on ? W.start() : W.stopSoon(); A.rainFilter(); },
};

/* ================================================================== UI */
const IC = {
  radio: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="8.5" width="18" height="11.5" rx="3.2"/><circle cx="8.5" cy="14.2" r="2.6"/><path d="M14.5 12.5h3.5M14.5 16h3.5M8 8.5 15.5 3.5"/></svg>',
  rain: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M7.2 15a4 4 0 0 1 .4-8 5.5 5.5 0 0 1 10.3 1.7A3.2 3.2 0 0 1 17.6 15z"/><path d="M8.5 18.2 7.6 20.4M12.5 18.2l-.9 2.2M16.5 18.2l-.9 2.2"/></svg>',
  fan: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="10.5" r="7.5"/><circle cx="12" cy="10.5" r="1.4"/><path d="M12 9.1c-.4-2.4.3-4.3 1.6-4.4M13.3 11.2c2.2.9 3.4 2.4 2.9 3.6M10.7 11.2c-1.9 1.4-3.8 1.7-4.5.6M12 18v3M9 21h6"/></svg>',
  cat: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M5 9.5 5.6 4l4.2 3h4.4l4.2-3 .6 5.5c.7 1.2 1 2.4 1 3.7 0 4-3.6 6.8-8 6.8s-8-2.8-8-6.8c0-1.3.3-2.5 1-3.7z"/><path d="M8.6 13.2c.5.4 1.1.4 1.6 0M13.8 13.2c.5.4 1.1.4 1.6 0M11.2 15.6h1.6l-.8.8z"/></svg>',
  window: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="3"/><path d="M12 3v18M4 12h16"/></svg>',
  sun: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6 6 6M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4 6 18M18 6l1.4-1.4"/></svg>',
  moon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M19.5 14.6A7.8 7.8 0 0 1 9.4 4.5a7.8 7.8 0 1 0 10.1 10.1z"/></svg>',
};
const CH = [
  { key: 'radio', name: 'Radio lofi', chip: 'var(--c-radio)' },
  { key: 'rain', name: 'Pluie', chip: 'var(--c-rain)' },
  { key: 'fan', name: 'Bruit blanc', chip: 'var(--c-fan)' },
  { key: 'cat', name: 'Ronron', chip: 'var(--c-cat)' },
  { key: 'window', name: 'Dehors', chip: 'var(--c-win)' },
];
function subFor(key) {
  switch (key) {
    case 'radio': return state.on.radio && R.chordName ? `${R.chordName} · 72 bpm` : 'lofi · 72 bpm';
    case 'rain': return state.on.window ? 'vitre ouverte' : 'vitre fermée';
    case 'fan': return 'ventilateur';
    case 'cat': return 'chat endormi';
    case 'window': return state.night ? 'grillons' : 'oiseaux';
  }
  return '';
}
const mix = $('#mix'), cards = {};
CH.forEach((c) => {
  const el = document.createElement('div');
  el.className = 'card';
  el.innerHTML = `<button class="tg" type="button" aria-pressed="false"><span class="ico" style="--chip:${c.chip}">${IC[c.key]}<span class="eq" aria-hidden="true"><i></i><i></i><i></i></span></span><span class="txt"><span class="nm">${c.name}</span><span class="sb"></span></span></button><input type="range" min="0" max="100" value="${Math.round(state.vol[c.key] * 100)}" id="vol-${c.key}" aria-label="Volume ${c.name}">`;
  el.querySelector('.tg').addEventListener('click', () => toggle(c.key));
  el.querySelector('input').addEventListener('input', (e) => { state.vol[c.key] = e.target.value / 100; A.volume(c.key); });
  mix.appendChild(el);
  cards[c.key] = { el, tg: el.querySelector('.tg'), sb: el.querySelector('.sb') };
});

const hsWrap = $('#hotspots'), hotspots = [];
Object.values(interact).forEach((it, i) => {
  const b = document.createElement('button');
  b.className = 'hs'; b.type = 'button';
  b.setAttribute('aria-label', it.label);
  b.style.setProperty('--d', `${(i * 0.37).toFixed(2)}s`);
  b.innerHTML = `<span class="lbl">${it.label}</span>`;
  b.addEventListener('click', () => toggle(it.key));
  hsWrap.appendChild(b);
  hotspots.push({ el: b, it });
});

const modeBtn = $('#mode'), muteBtn = $('#mute'), countEl = $('#count');
modeBtn.addEventListener('click', () => { A.ensure(); setNight(!state.night); interact.lamp.boing = clock.elapsedTime; });
muteBtn.addEventListener('click', () => {
  Object.keys(state.on).forEach((k) => { if (state.on[k]) { state.on[k] = false; A.set(k); } });
  pop(false); syncUI();
});

let taps = 0;
function toggle(key) {
  A.ensure();
  taps++;
  if (taps >= 3) document.body.classList.add('seasoned');
  if (interact[key]) interact[key].boing = clock.elapsedTime;
  if (key === 'lamp') { setNight(!state.night); return; }
  state.on[key] = !state.on[key];
  A.set(key);
  pop(state.on[key]);
  syncUI();
}
function setNight(v) {
  state.night = v;
  rootEl.classList.toggle('night', v);
  pop(!v);
  syncUI();
}
function syncUI() {
  let n = 0;
  CH.forEach(({ key }) => {
    const on = state.on[key]; if (on) n++;
    const c = cards[key];
    c.el.classList.toggle('on', on);
    c.tg.setAttribute('aria-pressed', String(on));
    c.sb.textContent = subFor(key);
  });
  hotspots.forEach((h) => h.el.classList.toggle('on', h.it.key === 'lamp' ? state.night : !!state.on[h.it.key]));
  countEl.textContent = n === 0 ? 'silence' : `${n} son${n > 1 ? 's' : ''} actif${n > 1 ? 's' : ''}`;
  muteBtn.hidden = n === 0;
  modeBtn.innerHTML = state.night ? IC.moon : IC.sun;
  modeBtn.setAttribute('aria-label', state.night ? 'Passer en journée' : 'Passer en nuit');
}

const clockEl = $('#clock');
function tickClock() { clockEl.textContent = new Date().toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' }); }
tickClock(); setInterval(tickClock, 15000);

/* ------------------------------------------------------------------ framing */
let VW = innerWidth, VH = innerHeight;
const topEl = $('#top'), dockEl = $('#dock');
function frame() {
  VW = innerWidth; VH = innerHeight;
  renderer.setSize(VW, VH, false);
  const topPx = topEl.querySelector('.brand').getBoundingClientRect().bottom + 8;
  const botPx = VH - dockEl.querySelector('.dock-inner').getBoundingClientRect().top + 8;
  const availH = Math.max(180, VH - topPx - botPx);
  const unit = Math.min(VW / 10.4, availH / 9.6);
  const vw = VW / unit, vh = VH / unit, shift = (botPx - topPx) / 2 / unit;
  camera.left = -vw / 2; camera.right = vw / 2; camera.top = vh / 2 - shift; camera.bottom = -vh / 2 - shift;
  camera.updateProjectionMatrix();
}
addEventListener('resize', frame);
if (window.ResizeObserver) new ResizeObserver(frame).observe(dockEl);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(frame);

/* ------------------------------------------------------------------ pointer: tap objects, drag to turn */
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
function pick(cx, cy) {
  ndc.set((cx / VW) * 2 - 1, -(cy / VH) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  const hit = ray.intersectObjects(room.children, true)[0];
  return hit ? hit.object.userData.key || null : null;
}
let rot = 0, rotTarget = 0, down = null, hoverKey = null;
canvas.addEventListener('pointerdown', (e) => {
  down = { x: e.clientX, y: e.clientY, rot: rotTarget, moved: false, id: e.pointerId };
  try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
});
canvas.addEventListener('pointermove', (e) => {
  if (down && e.pointerId === down.id) {
    const dx = e.clientX - down.x, dy = e.clientY - down.y;
    if (!down.moved && Math.hypot(dx, dy) > 8) down.moved = true;
    if (down.moved) rotTarget = clamp(down.rot + dx * 0.006, -0.6, 0.6);
  } else if (e.pointerType === 'mouse') {
    hoverKey = pick(e.clientX, e.clientY);
    canvas.style.cursor = hoverKey ? 'pointer' : 'grab';
  }
});
canvas.addEventListener('pointerup', (e) => {
  if (!down || e.pointerId !== down.id) return;
  if (!down.moved) { const k = pick(e.clientX, e.clientY); if (k) toggle(k); }
  down = null;
});
canvas.addEventListener('pointercancel', () => { down = null; });
canvas.addEventListener('pointerleave', () => { if (!down) hoverKey = null; });

/* ------------------------------------------------------------------ particles */
const parts = [];
function emit(tex, x, y, z, o) {
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthWrite: false, opacity: 0 }));
  s.raycast = noRay; s.position.set(x, y, z); s.scale.setScalar(o.size);
  fx.add(s);
  parts.push({ s, life: 0, max: o.life, vy: o.vy, sway: o.sway, phase: Math.random() * TAU, x0: x, size: o.size, grow: o.grow || 0, peak: o.peak || 1 });
}
function updateParts(dt) {
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i]; p.life += dt;
    const k = p.life / p.max;
    if (k >= 1) { fx.remove(p.s); p.s.material.dispose(); parts.splice(i, 1); continue; }
    p.s.position.y += p.vy * dt;
    p.s.position.x = p.x0 + Math.sin(p.phase + p.life * 2.2) * p.sway;
    p.s.material.opacity = Math.sin(Math.PI * k) * p.peak;
    p.s.scale.setScalar(p.size * (1 + p.grow * k));
  }
}

/* ------------------------------------------------------------------ loop */
const clock = new THREE.Clock();
const tmpV = new THREE.Vector3();
let nightT = state.night ? 1 : 0, rainT = 0, winT = 0, fanSpeed = 0, fanAng = 0, swivel = 0;
let lastKick = -10, noteFlip = false, heartT = 0, steamT = 0, skyN = -1, skyR = -1;

function loop() {
  const dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime;

  nightT = approach(nightT, state.night ? 1 : 0, dt * 1.1);
  rainT = approach(rainT, state.on.rain ? 1 : 0, dt * 0.8);
  winT = approach(winT, state.on.window ? 1 : 0, dt * 1.6);
  const e = smooth(nightT);

  // light
  hemi.color.copy(COL.hemiDay).lerp(COL.hemiNight, e);
  hemi.groundColor.copy(COL.gDay).lerp(COL.gNight, e);
  hemi.intensity = lerp(0.62, 0.42, e) * (1 - rainT * 0.12);
  sun.color.copy(COL.sunDay).lerp(COL.sunNight, e);
  sun.intensity = lerp(0.6, 0.28, e) * (1 - rainT * 0.3);
  lampLight.intensity = e * 1.8;
  M.lampCap.emissiveIntensity = 0.04 + e * 1.0;
  glow.material.opacity = e * 0.75;
  fairyMats.forEach((m, i) => { m.emissiveIntensity = 0.15 + e * (1.15 + 0.3 * Math.sin(t * 2 + i * 2)); });
  M.dial.emissiveIntensity = state.on.radio ? 0.9 : 0.08;
  if (Math.abs(nightT - skyN) > 0.01 || Math.abs(rainT - skyR) > 0.01) { drawSky(e, smooth(rainT)); skyN = nightT; skyR = rainT; }

  // room float + rotation
  rot += (rotTarget - rot) * Math.min(1, dt * 6);
  room.rotation.y = rot;
  room.position.y = reduceMotion ? 0 : Math.sin(t * 0.7) * 0.06;

  // window casements
  const wo = smooth(winT);
  leftPivot.rotation.y = -wo * 1.08;
  rightPivot.rotation.y = wo * 1.08;

  // fan
  fanSpeed = approach(fanSpeed, state.on.fan ? 22 : 0, dt * 14);
  fanAng += fanSpeed * dt; blades.rotation.z = fanAng;
  swivel += dt * 0.55 * (fanSpeed / 22);
  fanHead.rotation.y = -0.45 + Math.sin(swivel) * 0.4;

  // cloud + rain
  cloud.position.y = 4.95 + (reduceMotion ? 0 : Math.sin(t * 0.9) * 0.08);
  cloud.position.x = 1.3 + (state.on.rain ? Math.sin(t * 13) * 0.012 : 0);
  cloudMat.color.copy(COL.cloudDay).lerp(COL.cloudRain, smooth(rainT));
  let spawnBudget = state.on.rain ? Math.ceil(dt * 160) : 0;
  for (let i = 0; i < DROPS; i++) {
    const d = dropData[i];
    if (d.alive) {
      d.y -= d.v * dt;
      if (d.y < -0.3) { if (state.on.rain) spawnDrop(d); else d.alive = false; }
    } else if (spawnBudget > 0) { spawnDrop(d); d.y -= Math.random() * 0.5; spawnBudget--; }
    dummy.position.set(d.x, d.y, d.z);
    dummy.scale.setScalar(d.alive ? 1 : 0);
    dummy.updateMatrix();
    drops.setMatrixAt(i, dummy.matrix);
  }
  drops.instanceMatrix.needsUpdate = true;

  // radio sync
  if (A.ctx) {
    const now = A.ctx.currentTime;
    while (R.kicks.length && R.kicks[0] <= now) {
      R.kicks.shift(); lastKick = t;
      if (state.on.radio) { noteFlip = !noteFlip; emit(noteFlip ? noteTexA : noteTexB, 1.9 + rand(-0.3, 0.3), 2.05, -2.4, { size: 0.26, life: 2.6, vy: 0.55, sway: 0.12 }); }
    }
    let name = '';
    for (const c of R.chords) if (c.t <= now) name = c.name;
    if (name !== R.chordName) { R.chordName = name; cards.radio.sb.textContent = subFor('radio'); }
  }
  needle.position.x = 0.1 + (state.on.radio ? 0.1 + Math.sin(t * 0.3) * 0.02 : 0);
  antenna.rotation.z = 0.35 + (state.on.radio ? Math.sin(t * 3.1) * 0.05 : 0);

  // cat
  const purr = state.on.cat;
  catBody.scale.y = 0.21 * (1 + (purr ? 0.06 : 0.025) * Math.sin((t * TAU) / (purr ? 2.7 : 3.8)));
  tailG.rotation.y = 2.4 + (purr ? Math.sin(t * 1.7) * 0.12 : 0);
  heartT += dt;
  if (purr && heartT > 1.3) { heartT = 0; emit(heartTex, -0.85 + rand(-0.1, 0.1), 1.25, -0.4, { size: 0.2, life: 2.2, vy: 0.4, sway: 0.08 }); }

  // steam
  steamT += dt;
  if (steamT > 0.55) { steamT = 0; emit(puffTex, 2.55 + rand(-0.03, 0.03), 1.62, -2.2, { size: 0.14, life: 2.4, vy: 0.28, sway: 0.05, grow: 1.4, peak: 0.45 }); }
  updateParts(dt);

  // squash & hover
  for (const k in interact) {
    const it = interact[k];
    it.hover = approach(it.hover, hoverKey === k ? 1 : 0, dt * 6);
    if (!it.squash) continue;
    const a = t - it.boing, sq = a < 1.4 ? Math.sin(a * 17) * Math.exp(-a * 5.5) : 0;
    const bump = k === 'radio' && state.on.radio ? Math.exp(-(t - lastKick) * 9) * 0.05 : 0;
    const h = 1 + it.hover * 0.04;
    const sy = (1 - sq * 0.16 + bump) * h, sxz = (1 + sq * 0.1 - bump * 0.4) * h;
    it.group.scale.set(it.base.x * sxz, it.base.y * sy, it.base.z * sxz);
  }

  renderer.render(scene, camera);

  // hotspots follow their objects
  for (const hs of hotspots) {
    tmpV.copy(hs.it.anchor); room.localToWorld(tmpV); tmpV.project(camera);
    hs.el.style.transform = `translate3d(${((tmpV.x * 0.5 + 0.5) * VW).toFixed(1)}px,${((-tmpV.y * 0.5 + 0.5) * VH).toFixed(1)}px,0)`;
  }
  requestAnimationFrame(loop);
}

syncUI();
frame();
drawSky(nightT, 0);
requestAnimationFrame(loop);
})();
</script>
